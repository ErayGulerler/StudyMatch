openapi: 3.0.3
info:
  title: StudyMatch Moderation API (Member 4)
  version: 1.0.0
  description: >-
    Checkpoint 3 proposed API contract for reporting and moderation (US-16, US-17).
    Blocking a reported user reuses PATCH /admin/users/{userId}/status, which is
    defined in identity.yaml and is not repeated here.
servers:
- url: https://api.studymatch.example/api/v1
  description: Illustrative base URL, not a deployed server
tags:
- name: Reports
  description: Students report other students
- name: Administration
  description: Admin review of reports
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ReportId:
      in: path
      name: reportId
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
    ReportStatus:
      type: string
      enum:
      - PENDING
      - RESOLVED
    SubmitReportRequest:
      type: object
      required:
      - reportedUserId
      - reason
      additionalProperties: false
      properties:
        reportedUserId:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          minLength: 1
      example:
        reportedUserId: 3f6c9d12-7a4b-4c1e-8f2d-5b0a9e6c1d47
        reason: Offensive messages in group chat
    ResolveReportRequest:
      type: object
      required:
      - status
      - outcome
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - RESOLVED
        outcome:
          type: string
          minLength: 1
      example:
        status: RESOLVED
        outcome: Warning sent to the reported student
    Report:
      type: object
      required:
      - reportId
      - reporterId
      - reportedUserId
      - reason
      - status
      - submittedAt
      - reviewedById
      - outcome
      - resolvedAt
      properties:
        reportId:
          $ref: '#/components/schemas/Uuid'
        reporterId:
          $ref: '#/components/schemas/Uuid'
        reportedUserId:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        submittedAt:
          type: string
          format: date-time
        reviewedById:
          type: string
          format: uuid
          nullable: true
        outcome:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      example:
        reportId: b81e4f07-2c3d-4a9e-9f10-6d2a7c5e8b31
        reporterId: 9a0d5e22-1b7c-4f3a-8e6d-2c4b1a9f0e57
        reportedUserId: 3f6c9d12-7a4b-4c1e-8f2d-5b0a9e6c1d47
        reason: Offensive messages in group chat
        status: PENDING
        submittedAt: '2026-11-19T10:15:00Z'
        reviewedById: null
        outcome: null
        resolvedAt: null
    ReportPage:
      type: object
      required:
      - items
      - page
      - size
      - totalItems
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - timestamp
          properties:
            code:
              type: string
              example: DUPLICATE_REPORT
            message:
              type: string
              example: Report already pending
            timestamp:
              type: string
              format: date-time
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller lacks the required role or the account is suspended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate resource or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid field values
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /reports:
    post:
      tags:
      - Reports
      summary: Student reports another student (US-16)
      description: >-
        reporterId is taken from the JWT subject, never from the body. The report
        starts as PENDING and does not change the reported account's status.
        A second PENDING report by the same reporter on the same student returns
        409, so a retried POST does not create a duplicate.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReportRequest'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/reports:
    get:
      tags:
      - Administration
      summary: Admin lists reports by status, paged (US-17)
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/ReportStatus'
      - in: query
        name: page
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Page of reports (items may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/reports/{reportId}:
    parameters:
    - $ref: '#/components/parameters/ReportId'
    get:
      tags:
      - Administration
      summary: Admin reads one report (US-17)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Administration
      summary: Admin resolves a report with a written outcome (US-17)
      description: >-
        PENDING -> RESOLVED. RESOLVED is terminal, so resolving again returns 409.
        reviewedById is taken from the JWT subject. Resolving does not suspend
        the reported account; use PATCH /admin/users/{userId}/status (identity.yaml).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
      responses:
        '200':
          description: Resolved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
